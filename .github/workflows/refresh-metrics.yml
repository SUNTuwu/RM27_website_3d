name: Refresh public project metrics

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: refresh-public-project-metrics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Refresh GitHub stars and forum citation metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-metrics.mjs

      - name: Commit changed metrics
        run: |
          METRICS_PATH="assets/open-source/data/metrics.json"
          if git diff --quiet -- "$METRICS_PATH"; then
            echo "No metric changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$METRICS_PATH"
          git commit -m "chore: refresh public project metrics"
          git push
